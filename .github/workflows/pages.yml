name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "src/RouteOptimizer.Driver.Pwa/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  BASE_HREF: "/RouteOptimizer/"

jobs:
  build:
    name: Build Blazor WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish
        run: >
          dotnet publish src/RouteOptimizer.Driver.Pwa/RouteOptimizer.Driver.Pwa.csproj
          --configuration Release
          --output release

      - name: Rewrite base href for project page
        run: >
          sed -i 's|<base href="[^"]*"|<base href="${{ env.BASE_HREF }}"|'
          release/wwwroot/index.html

      - name: SPA fallback (copy index.html to 404.html)
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Disable Jekyll (keep _framework folder)
        run: touch release/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
