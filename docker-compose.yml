services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: route-optimizer-db
    environment:
      POSTGRES_DB: routeoptimizer
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d routeoptimizer"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio
    container_name: route-optimizer-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  redis:
    image: redis:7-alpine
    container_name: routeopt-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
     test: [ "CMD", "redis-cli", "ping" ]
     interval: 10s
     timeout: 3s
     retries: 5
      
  mailhog:
    image: mailhog/mailhog
    container_name: route-optimizer-mail
    ports:
      - "1025:1025"
      - "8025:8025"

  osrm-download:
    image: curlimages/curl:latest
    container_name: route-optimizer-osrm-download
    user: root
    volumes:
      - osrm_data:/data
    command: >
      -fL --retry 3 --retry-delay 5
      -o /data/map.osm.pbf
      https://download.geofabrik.de/europe/poland-latest.osm.pbf
    profiles: ["init"]

  osrm-init:
    image: osrm/osrm-backend
    container_name: route-optimizer-osrm-init
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - osrm_data:/data
    command: >
      sh -c "
        osrm-extract -p /opt/car.lua /data/map.osm.pbf &&
        osrm-partition /data/map.osrm &&
        osrm-customize /data/map.osrm
      "
    profiles: ["init"]

  osrm:
    image: osrm/osrm-backend
    container_name: route-optimizer-osrm
    ports:
      - "5000:5000"
    volumes:
      - osrm_data:/data
    command: osrm-routed --algorithm mld /data/map.osrm --max-table-size 10000

  api:
    build:
      context: .
      dockerfile: src/RouteOptimizer.API/Dockerfile
    container_name: route-optimizer-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      osrm:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=routeoptimizer;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - ConnectionStrings__Redis=redis:6379
      - Osrm__BaseUrl=http://osrm:5000
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      - Minio__UseSSL=false
      - Smtp__Host=mailhog
      - Smtp__Port=1025
      - Jwt__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - Jwt__Issuer=RouteOptimizer
      - Jwt__Audience=RouteOptimizer
      - Jwt__AccessTokenExpirationMinutes=60
      - Jwt__RefreshTokenExpirationHours=12
      - Cors__AllowedOrigins__0=http://localhost:5080
      - Cors__AllowedOrigins__1=https://localhost:7080
      - Smtp__From=noreply@routeoptimizer.local
      - Smtp__UseSsl=false


volumes:
  postgres_data:
  minio_data:
  osrm_data:
    external: true
    name: routeoptimizer_osrm_data
  redis-data:
