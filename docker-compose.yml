services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: route-optimizer-db
    environment:
      POSTGRES_DB: routeoptimizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  minio:
    image: minio/minio
    container_name: route-optimizer-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
      
  mailhog:
    image: mailhog/mailhog
    container_name: route-optimizer-mail
    ports:
      - "1025:1025"
      - "8025:8025"
      

volumes:
  postgres_data:
  minio_data: